name: Feature request
description: Suggest a new feature or an improvement to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Include an example of the API you have in mind, if any.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other components you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups or links to similar features elsewhere.
