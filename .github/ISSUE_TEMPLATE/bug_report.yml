name: Bug report
description: Report something that doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please check the [open issues](https://github.com/gabriel-msilva/streamlit-arborist/issues)
        first to see if it has already been reported.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens? Include error messages or tracebacks.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal example
      description: The smallest Streamlit app that reproduces the bug, and the steps to trigger it in the app.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: arborist-version
    attributes:
      label: streamlit-arborist version
      placeholder: "0.4.1"
    validations:
      required: true

  - type: input
    id: streamlit-version
    attributes:
      label: Streamlit version
      placeholder: "1.48.1"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 131 on Ubuntu 24.04

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings or anything else that helps explain the bug.
